specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SimpleStorage
    network: base-sepolia
    source:
      address: "0x24631D9a109e4671107044F50D231C5C583759c8"
      abi: SimpleStorage
      startBlock: 12160811
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DataChanged
      abis:
        - name: SimpleStorage
          file: ./abis/SimpleStorage.json
      eventHandlers:
        - event: DataChanged(uint256,uint256)
          handler: handleDataChanged
      file: ./src/simple-storage.ts
